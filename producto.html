<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guitarra — Diapasón</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <rect x="16" y="4" width="8" height="14" rx="2" fill="#CD9F3E"/>
      <rect x="18.5" y="16" width="3" height="18" rx="1.5" fill="#EFE3CB"/>
      <circle cx="20" cy="7" r="1.6" fill="#201409"/>
      <circle cx="20" cy="12" r="1.6" fill="#201409"/>
      <path d="M14 34c0 3.3 2.7 6 6 6s6-2.7 6-6-2.7-6-6-6-6 2.7-6 6z" stroke="#CD9F3E" stroke-width="2"/>
    </svg>
    <span class="brand-name">Diapasón</span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="tienda.html" class="current">Tienda</a></li>
    <li><a href="vender.html">Vender</a></li>
  </ul>
</nav>

<section class="section" id="product-section">
  <!-- se completa con JS -->
</section>

<footer class="footer">
  <span>Hecho a mano, como una buena guitarra. — Diapasón, 2026</span>
  <a href="tienda.html" style="color: var(--brass);">Volver a la tienda</a>
</footer>

<script src="js/data.js"></script>
<script src="js/motion.js"></script>
<script>
  let currentSlide = 0;

  function galleryTemplate(g) {
    const photos = g.photos && g.photos.length ? g.photos : null;

    if (!photos) {
      return `
        <div class="product-visual reveal">
          <div class="card-hole"></div>
          <div class="card-string"></div>
          <div class="product-swatch" style="background:${g.color};"></div>
          <span class="card-type">${g.type}</span>
          <div class="product-tags"><span class="tag">${g.condition}</span></div>
        </div>
      `;
    }

    const slides = photos
      .map((src) => `<div class="gallery-slide"><img src="${src}" alt="${g.name}" /></div>`)
      .join("");

    const dots = photos
      .map(
        (_, i) =>
          `<button class="gallery-dot${i === 0 ? " active" : ""}" data-index="${i}" aria-label="Foto ${i + 1}"></button>`
      )
      .join("");

    const controls =
      photos.length > 1
        ? `
        <button class="gallery-arrow prev" id="gallery-prev" aria-label="Foto anterior">‹</button>
        <button class="gallery-arrow next" id="gallery-next" aria-label="Foto siguiente">›</button>
        <div class="gallery-dots">${dots}</div>
      `
        : "";

    return `
      <div class="gallery reveal">
        <div class="gallery-track" id="gallery-track">${slides}</div>
        ${controls}
      </div>
    `;
  }

  function updateGallery(total) {
    const track = document.getElementById("gallery-track");
    if (!track) return;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll(".gallery-dot").forEach((dot, i) => {
      dot.classList.toggle("active", i === currentSlide);
    });
  }

  function setupGallery(total) {
    if (total <= 1) return;
    document.getElementById("gallery-prev").addEventListener("click", () => {
      currentSlide = (currentSlide - 1 + total) % total;
      updateGallery(total);
    });
    document.getElementById("gallery-next").addEventListener("click", () => {
      currentSlide = (currentSlide + 1) % total;
      updateGallery(total);
    });
    document.querySelectorAll(".gallery-dot").forEach((dot) => {
      dot.addEventListener("click", () => {
        currentSlide = Number(dot.dataset.index);
        updateGallery(total);
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { currentSlide = (currentSlide - 1 + total) % total; updateGallery(total); }
      if (e.key === "ArrowRight") { currentSlide = (currentSlide + 1) % total; updateGallery(total); }
    });
  }

  function render() {
    const id = getParam("id");
    const guitars = loadGuitars();
    const g = guitars.find((item) => String(item.id) === String(id));
    const section = document.getElementById("product-section");

    if (!g) {
      section.innerHTML = `
        <div class="not-found">
          <span class="eyebrow">Ups</span>
          <h1>No encontramos esa guitarra</h1>
          <p>Puede que ya se haya vendido o que el enlace esté mal escrito.</p>
          <a href="tienda.html" class="btn btn-primary">Volver a la tienda</a>
        </div>
      `;
      return;
    }

    section.innerHTML = `
      <p class="breadcrumb reveal"><a href="tienda.html">Tienda</a> / ${g.type} / ${g.name}</p>
      <div class="product-wrap">
        ${galleryTemplate(g)}
        <div class="product-info reveal" style="transition-delay: 100ms;">
          <span class="eyebrow">${g.type}</span>
          <h1>${g.name}</h1>
          <p class="product-price">${money(g.price)}</p>
          <p class="product-desc">${g.description}</p>
          <div class="seller-box">
            <p class="label">Publicado por</p>
            <p class="name">${g.seller}</p>
          </div>
          <a href="tienda.html" class="btn btn-ghost">Volver a la tienda</a>
        </div>
      </div>
    `;

    initReveal(section);
    const total = g.photos && g.photos.length ? g.photos.length : 0;
    setupGallery(total);
  }

  render();
</script>

</body>
</html>
