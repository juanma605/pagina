<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guitarra — Diapasón</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <rect x="16" y="4" width="8" height="14" rx="2" fill="#CD9F3E"/>
      <rect x="18.5" y="16" width="3" height="18" rx="1.5" fill="#EFE3CB"/>
      <circle cx="20" cy="7" r="1.6" fill="#201409"/>
      <circle cx="20" cy="12" r="1.6" fill="#201409"/>
      <path d="M14 34c0 3.3 2.7 6 6 6s6-2.7 6-6-2.7-6-6-6-6 2.7-6 6z" stroke="#CD9F3E" stroke-width="2"/>
    </svg>
    <span class="brand-name">Diapasón</span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="tienda.html" class="current">Tienda</a></li>
    <li><a href="vender.html">Vender</a></li>
  </ul>
</nav>

<section class="section" id="product-section">
  <!-- se completa con JS -->
</section>

<footer class="footer">
  <span>Hecho a mano, como una buena guitarra. — Diapasón, 2026</span>
  <a href="tienda.html" style="color: var(--brass);">Volver a la tienda</a>
</footer>

<script src="js/data.js"></script>
<script>
  function render() {
    const id = getParam("id");
    const guitars = loadGuitars();
    const g = guitars.find((item) => String(item.id) === String(id));
    const section = document.getElementById("product-section");

    if (!g) {
      section.innerHTML = `
        <div class="not-found">
          <span class="eyebrow">Ups</span>
          <h1>No encontramos esa guitarra</h1>
          <p>Puede que ya se haya vendido o que el enlace esté mal escrito.</p>
          <a href="tienda.html" class="btn btn-primary">Volver a la tienda</a>
        </div>
      `;
      return;
    }

    section.innerHTML = `
      <p class="breadcrumb"><a href="tienda.html">Tienda</a> / ${g.type} / ${g.name}</p>
      <div class="product-wrap">
        <div class="product-visual">
          <div class="card-hole"></div>
          <div class="card-string"></div>
          <div class="product-swatch" style="background:${g.color};"></div>
          <span class="card-type">${g.type}</span>
          <div class="product-tags">
            <span class="tag">${g.condition}</span>
          </div>
        </div>
        <div class="product-info">
          <span class="eyebrow">${g.type}</span>
          <h1>${g.name}</h1>
          <p class="product-price">${money(g.price)}</p>
          <p class="product-desc">${g.description}</p>
          <div class="seller-box">
            <p class="label">Publicado por</p>
            <p class="name">${g.seller}</p>
          </div>
          <a href="tienda.html" class="btn btn-ghost">Volver a la tienda</a>
        </div>
      </div>
    `;
  }

  render();
</script>

</body>
</html>
